name: Mirror corresponding sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.0 --pattern corresponding-sources.json --dir dist
      - name: Reconstruct and verify exact source archives
        run: |
          python3 scripts/mirror_release_sources.py
          python3 scripts/verify_sources.py
      - name: Upload matching sources to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0 dist/mandarin-0.1.0-corresponding-sources-*.tar --clobber
